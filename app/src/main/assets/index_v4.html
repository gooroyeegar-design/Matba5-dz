<script>
const API='https://www.themealdb.com/api/json/v1/1/';const UNIT='https://theunitools.com/data/unitools-recipes-v1.json';
const T={ar:{home:'الرئيسية',library:'مكتبة الوصفات',saved:'المحفوظات',plan:'خطتي',start:'ابدأ الخطة',sub:'جاوبني على شوية أسئلة ونرتبلك وصفات تناسبك.',meals:'شنو الوجبات اللي حاب تخطط لها؟',mealSub:'اختار فطور، غداء، عشاء أو أكثر.',diet:'كيفاش تحب تاكل؟',allergy:'كاين حساسية أو مكونات لازم نتفاداها؟',allergySub:'الحساسية استبعاد صارم. إذا المعلومة غير مؤكدة راح تبان كتنبيه.',equipment:'واش عندك في الكوزينة؟',budget:'شحال حاب تصرف؟',time:'قداش عندك من الوقت؟',ingredients:'واش كاين عندك فالدار؟',servings:'لشحال من شخص؟',next:'التالي',back:'رجوع',make:'وجدلي الخطة',building:'نرتبلك الوصفات...',buildingSub:'نقارن الوقت، الميزانية، المكونات، الحساسية والذوق.',recipes:'وصفات',save:'حفظ في مكتبتي',savedToast:'تحفظت في مكتبتك',ingredientsTitle:'المكونات',steps:'الطريقة',minutes:'دقيقة',search:'ابحث عن وصفة...',no:'ما لقيناش وصفة مطابقة حالياً.',loading:'نحمّل مكتبة الوصفات...',breakfast:'فطور',lunch:'غداء',dinner:'عشاء',language:'اللغة'},fr:{home:'Accueil',library:'Bibliothèque',saved:'Enregistrées',plan:'Mon plan',start:'Créer mon plan',sub:'Réponds à quelques questions et je choisis des recettes adaptées.',meals:'Quels repas veux-tu planifier ?',mealSub:'Choisis un ou plusieurs repas.',diet:'Comment veux-tu manger ?',allergy:'Des allergies ou ingrédients à éviter ?',allergySub:'Les allergies sont des exclusions strictes.',equipment:'Quels équipements as-tu ?',budget:'Quel budget ?',time:'Combien de temps ?',ingredients:'Qu’as-tu déjà à la maison ?',servings:'Pour combien de personnes ?',next:'Suivant',back:'Retour',make:'Créer mon plan',building:'Je prépare ton plan...',buildingSub:'Je compare temps, budget, ingrédients, allergies et préférences.',recipes:'recettes',save:'Enregistrer',savedToast:'Enregistrée',ingredientsTitle:'Ingrédients',steps:'Préparation',minutes:'min',search:'Rechercher une recette...',no:'Aucune recette correspondante.',loading:'Chargement de la bibliothèque...',breakfast:'Petit-déjeuner',lunch:'Déjeuner',dinner:'Dîner',language:'Langue'},en:{home:'Home',library:'Recipe library',saved:'Saved',plan:'My plan',start:'Build my plan',sub:'Answer a few questions and I’ll choose recipes that fit you.',meals:'Which meals should I plan?',mealSub:'Choose one or more meals.',diet:'How do you like to eat?',allergy:'Any allergies or ingredients to avoid?',allergySub:'Allergies are strict exclusions.',equipment:'Which kitchen equipment do you have?',budget:'What is your budget?',time:'How much time do you have?',ingredients:'What do you already have at home?',servings:'How many people?',next:'Next',back:'Back',make:'Build my plan',building:'Building your plan...',buildingSub:'Comparing time, budget, ingredients, allergies and preferences.',recipes:'recipes',save:'Save to my library',savedToast:'Saved',ingredientsTitle:'Ingredients',steps:'Method',minutes:'min',search:'Search recipes...',no:'No matching recipes yet.',loading:'Loading recipe library...',breakfast:'Breakfast',lunch:'Lunch',dinner:'Dinner',language:'Language'}};
const A={lang:localStorage.getItem('mdz_lang')||'ar',view:'home',step:0,answers:{meals:new Set(['breakfast','lunch','dinner']),diet:new Set(),allergies:new Set(),equipment:new Set(),budget:500,time:45,servings:2,ingredients:''},recipes:JSON.parse(localStorage.getItem('mdz_recipe_cache_v4')||'[]'),saved:JSON.parse(localStorage.getItem('mdz_saved_v4')||'[]'),plan:[]};
const mealOpts=[['🌅','breakfast'],['☀️','lunch'],['🌙','dinner']],dietOpts=[['✨','normal'],['☪️','halal'],['🌱','vegetarian'],['🌿','vegan'],['🥑','keto'],['💪','high-protein'],['🥒','low-carb'],['🍬','low-sugar']],allergyOpts=[['🌾','gluten'],['🥛','dairy'],['🥜','peanut'],['🥚','egg'],['🐟','fish'],['🦐','shellfish'],['🌰','nuts'],['🫘','soy']],equipOpts=[['🔥','oven'],['💨','air fryer'],['🍳','pan'],['🍲','pot'],['🥤','blender'],['⚡','microwave'],['♨️','steamer']];
const titleDict={'Chicken Biryani':['برياني بالدجاج','Biryani au poulet'],'Chicken Curry':['كاري الدجاج','Curry de poulet'],'Chicken Alfredo Primavera':['دجاج ألفريدو بالخضار','Poulet Alfredo aux légumes'],'Beef Stroganoff':['ستروغانوف باللحم','Bœuf Stroganoff'],'Spaghetti Bolognese':['سباغيتي بولونيز','Spaghetti bolognaise'],'Spaghetti Carbonara':['سباغيتي كاربونارا','Spaghetti carbonara'],'Lasagne':['لازانيا','Lasagnes'],'Greek Salad':['سلطة يونانية','Salade grecque'],'Caesar Salad':['سلطة سيزر','Salade César'],'Apple Pie':['فطيرة التفاح','Tarte aux pommes'],'Pancakes':['بانكيك','Pancakes'],'French Onion Soup':['شوربة البصل','Soupe à l’oignon'],'Fish Pie':['فطيرة السمك','Tourte au poisson'],'Tuna Nicoise':['سلطة نيسواز بالتونة','Salade niçoise au thon'],'Kedgeree':['كجري','Kedgeree'],'Mutabbaq':['مطبق','Moutabbak']};
function titleOf(r){if(A.lang==='en')return r.name;const d=titleDict[r.name];if(d)return A.lang==='ar'?d[0]:d[1];return r.name}function saveCache(){localStorage.setItem('mdz_recipe_cache_v4',JSON.stringify(A.recipes.slice(0,1400)))}function key(s){return(s||'').toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').replace(/[^a-z0-9\\u0600-\\u06ff]+/g,' ')}function t(k){return T[A.lang][k]||T.en[k]||k}function setLang(l){A.lang=l;localStorage.setItem('mdz_lang',l);document.documentElement.lang=l;document.documentElement.dir=l==='ar'?'rtl':'ltr';render()}function showToast(x){const e=document.getElementById('toast');e.textContent=x;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}function pick(o,v){o.has(v)?o.delete(v):o.add(v)}
function mealGuess(r){const s=key((r.name||'')+' '+(r.category||'')+' '+(r.tags||''));if(/pancake|waffle|omelet|omelette|breakfast|porridge|toast|muffin|egg/.test(s))return'breakfast';if(/dessert|cake|pie|pudding|cookie|brownie|ice cream|tart/.test(s))return'dinner';return'lunch'}
function allergens(r){const s=key((r.name||'')+' '+(r.ingredients||[]).map(x=>x.name).join(' '));const a=[];if(/wheat|flour|bread|pasta|soy sauce|noodle/.test(s))a.push('gluten');if(/milk|cream|cheese|butter|yogurt/.test(s))a.push('dairy');if(/peanut/.test(s))a.push('peanut');if(/egg/.test(s))a.push('egg');if(/fish|tuna|salmon|cod|anchov/.test(s))a.push('fish');if(/shrimp|prawn|crab|mussel|clam/.test(s))a.push('shellfish');if(/almond|walnut|cashew|pistachio|hazelnut|nut/.test(s))a.push('nuts');if(/soy|tofu|edamame/.test(s))a.push('soy');return[...new Set(a)]}
function normaliseMeal(x,source){if(source==='mealdb'){const ingredients=[];for(let i=1;i<=20;i++){const n=x['strIngredient'+i],m=x['strMeasure'+i];if(n&&n.trim())ingredients.push({name:n.trim(),measure:(m||'').trim()})}return{id:'mdb_'+x.idMeal,name:x.strMeal,ingredients,steps:(x.strInstructions||'').split(/\\r?\\n|(?<=[.!?])\\s+(?=Step\\s+\\d)/).map(s=>s.trim()).filter(Boolean),image:x.strMealThumb,category:x.strCategory||'',tags:x.strTags||'',source:'TheMealDB',time:45,servings:4,allergens:allergens({name:x.strMeal,ingredients}),meal:mealGuess({name:x.strMeal,category:x.strCategory,tags:x.strTags})}}return{id:'unit_'+(x.slug||x.name),name:x.name?.en||x.name||'Recipe',ingredients:(x.ingredients||[]).map(i=>({name:i.name,measure:[i.quantity,i.unit].filter(Boolean).join(' ')})),steps:(x.steps||[]).map(s=>s.text||s),image:x.photo?.url||'',category:x.category||'',tags:(x.diets||[]).join(','),source:'UniTools',time:(x.prepMinutes||0)+(x.cookMinutes||0),servings:x.baseServings||2,allergens:allergens(x),meal:mealGuess(x)}}
async function getLetter(ch){try{const r=await fetch(API+'search.php?f='+ch);const j=await r.json();return(j.meals||[]).map(x=>normaliseMeal(x,'mealdb')).filter(x=>x.image)}catch{return[]}}
async function warmCatalog(){if(A.recipes.length>=900)return;const chars='abcdefghijklmnopqrstuvwxyz'.split('');for(let i=0;i<chars.length;i+=5){const batch=await Promise.all(chars.slice(i,i+5).map(getLetter));const map=new Map(A.recipes.map(r=>[r.id,r]));batch.flat().forEach(r=>map.set(r.id,r));A.recipes=[...map.values()];saveCache();if(A.view==='library')render()}}
async function loadUnitools(){try{const r=await fetch(UNIT);if(!r.ok)return;const data=await r.json();const map=new Map(A.recipes.map(x=>[x.id,x]));data.forEach(x=>{const r=normaliseMeal(x,'unit');if(r.image)map.set(r.id,r)});A.recipes=[...map.values()].slice(0,1400);saveCache();if(A.view==='library')render()}catch{}}
function matches(r){const a=A.answers,al=allergens(r);if([...a.allergies].some(x=>al.includes(x)))return false;if(a.time&&r.time&&r.time>a.time)return false;const m=mealGuess(r);if(a.meals.size&&!a.meals.has(m))return false;const ing=key(a.ingredients);if(ing){const hay=key((r.ingredients||[]).map(x=>x.name).join(' '));r._match=ing.split(/[ ,،]+/).filter(Boolean).filter(x=>hay.includes(x)).length}else r._match=0;return true}
function score(r){let s=(r._match||0)*16;const d=A.answers.diet,al=key((r.tags||'')+' '+(r.name||''));if(d.has('vegetarian')&&!/chicken|beef|lamb|pork|fish|shrimp|prawn|meat/.test(al))s+=20;if(d.has('vegan')&&!/chicken|beef|lamb|pork|fish|shrimp|prawn|meat|milk|cream|cheese|egg|butter/.test(al))s+=25;if(d.has('high-protein')&&/chicken|beef|fish|egg|lentil|bean|chickpea/.test(al))s+=15;if(d.has('keto')&&!/pasta|rice|bread|potato|sugar|flour/.test(al))s+=15;if(d.has('low-carb')&&!/pasta|rice|bread|potato|sugar/.test(al))s+=15;s+=Math.max(0,25-Math.abs((r.time||45)-A.answers.time));return s}
function plan(){A.results=A.recipes.filter(matches).sort((a,b)=>score(b)-score(a)).slice(0,36);A.plan=[...A.results.slice(0,Math.max(3,A.answers.meals.size*3))];A.view='plan';render()}
function card(r){const saved=A.saved.includes(r.id);return`<article class="card" data-id="${esc(r.id)}"><img class="photo" src="${esc(r.image)}" alt="${esc(titleOf(r))}" loading="lazy"><div class="cardBody"><button class="heart" data-save="${esc(r.id)}">${saved?'♥':'♡'}</button><div class="cardTitle">${esc(titleOf(r))}</div><div class="meta"><span class="tag">${r.time||'—'} ${t('minutes')}</span><span class="tag">${r.servings||2}</span></div><div class="cost">${estimate(r)} دج</div>${r._match?`<div class="match">${r._match} ${A.lang==='ar'?'مكونات مطابقة':A.lang==='fr'?'ingrédients trouvés':'matching ingredients'}</div>`:''}</div></article>`}function estimate(r){const n=(r.ingredients||[]).length;return Math.min(2500,Math.max(120,Math.round(n*45+(r.time||30)*2)))}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function home(){return`<section class="screen center"><div class="hero">🍲</div><h1 class="title">${t('home')}</h1><p class="sub">${t('sub')}</p><button class="primary" id="start">${t('start')}</button><button class="secondary" id="openLib">${t('library')}</button></section>`}
function test(){const steps=['meals','diet','allergy','equipment','budget','time','ingredients','servings'],s=steps[A.step],pct=((A.step+1)/steps.length)*100;if(s==='meals')return choicesScreen(t('meals'),t('mealSub'),mealOpts,A.answers.meals,pct);if(s==='diet')return choicesScreen(t('diet'),'',dietOpts,A.answers.diet,pct);if(s==='allergy')return choicesScreen(t('allergy'),t('allergySub'),allergyOpts,A.answers.allergies,pct);if(s==='equipment')return choicesScreen(t('equipment'),'',[...equipOpts],A.answers.equipment,pct);if(s==='budget')return sliderScreen(t('budget'),A.answers.budget,100,3000,100,'budget');if(s==='time')return sliderScreen(t('time'),A.answers.time,10,180,5,'time');if(s==='ingredients')return`<section class="screen"><div class="progress"><i style="width:${pct}%"></i></div><h1 class="title">${t('ingredients')}</h1><div class="field"><input id="ingredients" value="${esc(A.answers.ingredients)}" placeholder="بطاطا، بيض، دجاج / pommes, œufs, poulet"></div><button class="primary" id="next">${t('next')}</button></section>`;return`<section class="screen"><div class="progress"><i style="width:${pct}%"></i></div><h1 class="title">${t('servings')}</h1><div class="budget">${A.answers.servings}</div><input class="slider" id="servings" type="range" min="1" max="12" value="${A.answers.servings}"><div class="range"><span>1</span><span>12</span></div><button class="primary" id="next">${A.step===7?t('make'):t('next')}</button></section>`}
function choicesScreen(q,s,opts,set,pct){return`<section class="screen"><div class="progress"><i style="width:${pct}%"></i></div><h1 class="title">${q}</h1><p class="sub">${s||''}</p><div class="choices">${opts.map(([ico,v])=>`<button class="choice ${set.has(v)?'sel':''}" data-choice="${v}"><span class="ico">${ico}</span><b>${label(v)}</b><span class="check">${set.has(v)?'✓':''}</span><span class="shine"></span></button>`).join('')}</div><button class="primary" id="next">${A.step===7?t('make'):t('next')}</button></section>`}
function label(v){const m={breakfast:t('breakfast'),lunch:t('lunch'),dinner:t('dinner'),normal:A.lang==='ar'?'عادي':A.lang==='fr'?'Classique':'Balanced',halal:'Halal',vegetarian:A.lang==='ar'?'نباتي':'Vegetarian',vegan:'Vegan',keto:'Keto','high-protein':A.lang==='ar'?'عالي البروتين':A.lang==='fr'?'Riche en protéines':'High protein','low-carb':A.lang==='ar'?'قليل الكارب':A.lang==='fr'?'Low carb':'Low carb','low-sugar':A.lang==='ar'?'قليل السكر':A.lang==='fr'?'Faible en sucre':'Low sugar',gluten:'Gluten',dairy:A.lang==='ar'?'حليب/ألبان':A.lang==='fr'?'Lait':'Dairy',peanut:A.lang==='ar'?'فول سوداني':'Peanuts',egg:A.lang==='ar'?'بيض':'Egg',fish:A.lang==='ar'?'سمك':'Fish',shellfish:A.lang==='ar'?'محار/روبيان':'Shellfish',nuts:A.lang==='ar'?'مكسرات':'Nuts',soy:'Soy',oven:A.lang==='ar'?'فرن':'Oven','air fryer':'Air fryer',pan:A.lang==='ar'?'مقلاة':'Pan',pot:A.lang==='ar'?'قدر':'Pot',blender:A.lang==='ar'?'خلاط':'Blender',microwave:A.lang==='ar'?'ميكروويف':'Microwave',steamer:A.lang==='ar'?'بخار':'Steamer'};return m[v]||v}
function sliderScreen(q,val,min,max,step,type){return`<section class="screen center"><div class="progress"><i style="width:${((A.step+1)/8)*100}%"></i></div><h1 class="title">${q}</h1><div class="budget">${val} <small>${type==='budget'?'دج':''}</small></div><input class="slider" id="${type}" type="range" min="${min}" max="${max}" step="${step}" value="${val}"><div class="range"><span>${min}${type==='budget'?' دج':''}</span><span>${max}${type==='budget'?' دج':''}</span></div><button class="primary" id="next">${t('next')}</button></section>`}
function library(){return`<section class="screen"><div class="resultsHead"><div><h1>${t('library')}</h1><p>${A.recipes.length} ${t('recipes')}</p></div><button class="lang" id="refresh">↻</button></div><div class="field"><input id="search" placeholder="${t('search')}"></div><div id="cards" class="library" style="margin-top:12px">${A.recipes.length?A.recipes.slice(0,60).map(card).join(''):`<p class="sub">${t('loading')}</p>`}</div></section>`}function planView(){return`<section class="screen"><div class="resultsHead"><div><h1>${t('plan')}</h1><p>${A.plan.length} ${t('recipes')}</p></div></div><div class="library">${A.plan.map(card).join('')}</div></section>`}function saved(){const rs=A.recipes.filter(r=>A.saved.includes(r.id));return`<section class="screen"><div class="resultsHead"><div><h1>${t('saved')}</h1><p>${rs.length} ${t('recipes')}</p></div></div><div class="library">${rs.map(card).join('')||`<p class="sub">${t('no')}</p>`}</div></section>`}
function loading(){return`<section class="screen loading"><div class="cook"><span class="steam s1"></span><span class="steam s2"></span><span class="steam s3"></span><span class="bubble"></span><div class="pot"><i class="handle h1"></i><i class="handle h2"></i></div></div><h2>${t('building')}</h2><p>${t('buildingSub')}</p><div class="dots"><i></i><i></i><i></i></div></section>`}
function render(){document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));const root=document.getElementById('root');root.innerHTML=A.view==='home'?home():A.view==='test'?test():A.view==='loading'?loading():A.view==='library'?library():A.view==='plan'?planView():saved();document.getElementById('langBtn').textContent=A.lang.toUpperCase();bind()}
function bind(){const bgt=document.getElementById('budget');if(bgt)bgt.oninput=()=>{A.answers.budget=+bgt.value;render()};const tim=document.getElementById('time');if(tim)tim.oninput=()=>{A.answers.time=+tim.value;render()};const srv=document.getElementById('servings');if(srv)srv.oninput=()=>{A.answers.servings=+srv.value;render()};document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{b.classList.remove('flash');void b.offsetWidth;b.classList.add('flash');const v=b.dataset.choice,s=A.step===0?A.answers.meals:A.step===1?A.answers.diet:A.step===2?A.answers.allergies:A.answers.equipment;pick(s,v);render()});const next=document.getElementById('next');if(next)next.onclick=()=>{if(A.step===6)A.answers.ingredients=document.getElementById('ingredients').value;if(A.step===7){A.answers.servings=+document.getElementById('servings').value;A.view='loading';render();setTimeout(plan,350);return}A.step++;render()};const st=document.getElementById('start');if(st)st.onclick=()=>{A.step=0;A.view='test';render()};const lib=document.getElementById('openLib');if(lib)lib.onclick=()=>{A.view='library';render();warmCatalog();loadUnitools()};const q=document.getElementById('search');if(q)q.oninput=()=>{const z=key(q.value);document.getElementById('cards').innerHTML=A.recipes.filter(r=>!z||key(titleOf(r)+' '+(r.ingredients||[]).map(x=>x.name).join(' ')).includes(z)).slice(0,80).map(card).join('')||`<p class="sub">${t('no')}</p>`;bindCards()};const refresh=document.getElementById('refresh');if(refresh)refresh.onclick=()=>{warmCatalog();loadUnitools()};bindCards()}
function bindCards(){document.querySelectorAll('[data-id]').forEach(c=>c.onclick=e=>{if(e.target.closest('[data-save]'))return;const r=A.recipes.find(x=>x.id===c.dataset.id);if(r)openRecipe(r)});document.querySelectorAll('[data-save]').forEach(b=>b.onclick=e=>{e.stopPropagation();const id=b.dataset.save;A.saved=A.saved.includes(id)?A.saved.filter(x=>x!==id):[...A.saved,id];localStorage.setItem('mdz_saved_v4',JSON.stringify(A.saved));showToast(t('savedToast'));render()})}
function openRecipe(r){const sheet=document.getElementById('sheet');sheet.innerHTML=`<button class="close" id="close">×</button><img class="sheetPhoto" src="${esc(r.image)}" alt="${esc(titleOf(r))}"><div class="sheetIn"><h1>${esc(titleOf(r))}</h1><div class="meta"><span class="tag">${r.time||'—'} ${t('minutes')}</span><span class="tag">${r.servings||2}</span></div><h2>${t('ingredientsTitle')}</h2><ul class="ing">${(r.ingredients||[]).map(i=>`<li><span>${esc(i.name)}</span><b>${esc(i.measure||'')}</b></li>`).join('')}</ul><h2>${t('steps')}</h2><ol class="steps">${(r.steps||[]).map(s=>`<li>${esc(s)}</li>`).join('')}</ol><button class="primary" id="saveDetail">♡ ${t('save')}</button><p class="note">${r.source==='TheMealDB'?'Recipe and photograph are served from the connected recipe source.':'Open-licensed recipe data with source information preserved.'}</p></div>`;document.getElementById('modal').classList.add('open');document.getElementById('close').onclick=()=>document.getElementById('modal').classList.remove('open');document.getElementById('saveDetail').onclick=()=>{if(!A.saved.includes(r.id))A.saved.push(r.id);localStorage.setItem('mdz_saved_v4',JSON.stringify(A.saved));showToast(t('savedToast'))}}
document.getElementById('langBtn').onclick=()=>{document.getElementById('modal').classList.add('open');document.getElementById('sheet').innerHTML=`<div class="sheetIn"><h2>${t('language')}</h2><div class="langGrid">${[['ar','العربية'],['fr','Français'],['en','English']].map(x=>`<button class="langBtn ${A.lang===x[0]?'active':''}" data-lang="${x[0]}">${x[1]}</button>`).join('')}</div></div>`;document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{setLang(b.dataset.lang);document.getElementById('modal').classList.remove('open')})};document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')e.currentTarget.classList.remove('open')};document.getElementById('back').onclick=()=>{if(A.view==='test'&&A.step>0){A.step--;render()}else{A.view='home';render()}};document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{A.view=b.dataset.nav==='home'?'home':b.dataset.nav;render();if(A.view==='library'){warmCatalog();loadUnitools()}});render();setTimeout(()=>{warmCatalog();loadUnitools()},500);
</script></body></html>
