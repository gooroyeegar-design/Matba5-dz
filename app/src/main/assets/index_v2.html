</style></head><body><div class="app"><header class="top"><button class="icon" onclick="go('home')">‹</button><div class="brand">MATBAK DZ<small>SMART MEAL COMPANION</small></div><button class="icon" onclick="toast('قريباً: البحث الذكي 🔎')">⌕</button></header><main id="root"></main><nav class="bottom"><div class="bottomin"><button class="nav active" onclick="go('home')"><b>⌂</b>الرئيسية</button><button class="nav" onclick="start()"><b>✦</b>خطتي</button><button class="nav" onclick="showSaved()"><b>♡</b>المحفوظات</button><button class="nav" onclick="toast('قائمة المشتريات قادمة 🛒')"><b>🛒</b>المشتريات</button></div></nav></div><div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div id="sheet" class="sheet"></div></div><div id="toast" class="toast"></div><script>
const A={step:0,answers:{meals:['breakfast','lunch','dinner'],diet:[],allergies:[],equipment:[],budget:500,time:45,servings:2,ingredients:''},recipes:[],saved:JSON.parse(localStorage.getItem('mdz_saved')||'[]')};
const IMG=['https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?auto=format&fit=crop&w=1000&q=85','https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=1000&q=85','https://images.unsplash.com/photo-1532550907401-a500c9a57435?auto=format&fit=crop&w=1000&q=85','https://images.unsplash.com/photo-1603133872878-684f208fb84b?auto=format&fit=crop&w=1000&q=85','https://images.unsplash.com/photo-1473093295043-cdd812d0e601?auto=format&fit=crop&w=1000&q=85','https://images.unsplash.com/photo-1528207776546-365bb710ee93?auto=format&fit=crop&w=1000&q=85'];
const Q=[
['meals','شنو الوجبات اللي حاب تخطط لها؟','تقدر تختار وحدة، زوج أو نهار كامل.',[['🌅','الفطور','breakfast'],['☀️','الغداء','lunch'],['🌙','العشاء','dinner']],1],
['diet','كيفاش تحب تاكل؟','اختار كل القيود والتفضيلات اللي تهمك.',[['✨','عادي','normal'],['☪️','حلال','halal'],['🌱','نباتي','vegetarian'],['🌿','Vegan','vegan'],['🥑','Keto','keto'],['💪','عالي البروتين','high-protein'],['🥒','قليل الكارب','low-carb'],['🍬','قليل السكر','low-sugar']],1],
['allergies','كاين حساسية أو مكونات لازم نتفاداها؟','الحساسية هنا استبعاد صارم، والمعلومات غير المؤكدة تظهر كتَنبيه.',[['🌾','غلوتين','gluten'],['🥛','حليب','dairy'],['🥚','بيض','eggs'],['🥜','فول سوداني','peanuts'],['🌰','مكسرات','nuts'],['🦐','مأكولات بحرية','seafood'],['🫘','صويا','soy'],['🚫','ما عنديش','none']],1],
['ingredients','واش كاين عندك فالدار؟','اكتب كل ما عندك. النظام يعطي أولوية للوصفات اللي تستعمل أكبر عدد منها.',null,0],
['equipment','وش من أدوات المطبخ عندك؟','نقدر نتفادى الفرن أو الـAir Fryer أو أي جهاز ما عندكش.',[['🔥','فرن','oven'],['💨','Air Fryer','airfryer'],['🍳','مقلاة','pan'],['🍲','قدر','pot'],['🥤','خلاط','blender'],['🥣','كسكاس','steamer'],['⚡','ميكروويف','microwave']],1],
['budget','شحال الميزانية؟','ميزانية تقريبية للوصفات التي ستظهر، بالدينار الجزائري.',null,2],
['time','وشحال عندك من الوقت؟','نحترم الحد الأقصى الذي تختاره.',null,3],
['servings','لشحال من شخص؟','نحسب الكميات والتكلفة على حسب العدد.',[['👤','شخص واحد','1'],['👥','شخصين','2'],['👨‍👩‍👧','4 أشخاص','4'],['🍽️','6 أشخاص','6']],0]
];
const BASE=[
['شكشوكة بالخضر','breakfast',15,220,['eggs','tomato','onion','pepper'],['gluten-free','dairy-free'],0],['بيض بالأعشاب مع خبز محمص','breakfast',12,180,['eggs','bread','herbs'],['gluten'],1],['بان كيك بالموز','breakfast',15,240,['banana','egg','flour','milk'],['gluten','dairy'],5],['شوربة عدس','lunch',30,260,['lentil','onion','carrot','tomato'],['vegan','gluten-free','dairy-free'],1],['دجاج بالخضر في الفرن','lunch',42,720,['chicken','potato','carrot','onion'],['dairy-free'],2],['أرز بالخضر والبيض','lunch',25,330,['rice','egg','carrot','peas','onion'],['gluten-free','dairy-free'],3],['سلطة تونة مشبعة','lunch',10,460,['tuna','tomato','lettuce','onion'],['gluten-free','dairy-free','high-protein'],1],['مكرونة بالطماطم والثوم','dinner',25,390,['pasta','tomato','garlic','oil'],['vegetarian'],4],['دجاج بالكاري والخضر','dinner',35,650,['chicken','rice','curry','carrot','onion'],['high-protein','dairy-free'],2],['بطاطا محمرة مع دجاج','dinner',35,590,['potato','chicken','garlic','paprika'],['high-protein','dairy-free'],2],['شوربة خضر','dinner',25,240,['carrot','zucchini','potato','onion'],['vegan','gluten-free','dairy-free'],1],['أرز بالدجاج والليمون','dinner',30,540,['rice','chicken','lemon','onion'],['high-protein','gluten-free','dairy-free'],3]];
function esc(x){return String(x||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function go(id){if(id==='home'){A.step=0;home()}else start()}
function home(){root.innerHTML='<section class="screen center"><div class="mascot">🍲</div><div class="eyebrow">🇩🇿 مصمم للحياة اليومية</div><h1 class="title">واش نطيب اليوم؟</h1><p class="sub">جاوب على شوية أسئلة، واحنا نرتبولك وصفات حسب الوجبات، الميزانية، وقتك، المكونات والحوايج اللي عندك.</p><button class="primary" onclick="start()">نبدا الخطة ✨</button><button class="ghost" onclick="start()">عندي مكونات ونحب أفكار 🧺</button><p class="sub" style="font-size:11px;margin-top:18px">ما نحملوش 200,000 وصفة داخل الهاتف؛ قاعدة الوصفات الكبيرة تكون في الخلفية مع بحث وفلاتر سريعة.</p></section>'}
function start(){A.step=0;renderQ()}
function renderQ(){let q=Q[A.step],p=Math.round(A.step/Q.length*100),html='<section class="screen center"><div class="progress"><i style="width:'+p+'%"></i></div><div class="mascot">'+(A.step===3?'🧺':A.step===5?'💰':A.step===6?'⏱️':'🍲')+'</div><div class="eyebrow">'+(A.step+1)+' من '+Q.length+'</div><h1 class="title">'+q[1]+'</h1><p class="sub">'+q[2]+'</p>';
if(q[4]===0)html+='<div class="field"><input id="ingredients" value="'+esc(A.answers.ingredients)+'" placeholder="مثال: بطاطا، بيض، بصل، دجاج"></div>';else if(q[4]===2)html+='<div class="budget"><span id="v">'+A.answers.budget+'</span> <small>دج</small></div><input id="range" class="slider" type="range" min="200" max="3000" step="50" value="'+A.answers.budget+'"><div class="range"><span>200</span><span>3000 دج</span></div>';else if(q[4]===3)html+='<div class="budget"><span id="v">'+A.answers.time+'</span> <small>دقيقة</small></div><input id="range" class="slider" type="range" min="10" max="120" step="5" value="'+A.answers.time+'"><div class="range"><span>10 د</span><span>120 د</span></div>';else html+='<div class="choices">'+q[3].map(o=>{let arr=A.answers[q[0]]||[];let sel=arr.includes(o[2]);return '<button class="choice '+(sel?'sel':'')+'" onclick="pick(\''+q[0]+'\',\''+o[2]+'\')"><span class="check">'+(sel?'✓':'')+'</span><b>'+o[0]+' '+o[1]+'</b><small>'+o[2]+'</small></button>'}).join('')+'</div>';
html+='<button class="primary" onclick="next()">'+(A.step===Q.length-1?'ورّيني الوصفات ✨':'التالي')+'</button>'+(A.step?' <button class="ghost" onclick="A.step--;renderQ()">رجوع</button>':'')+'</section>';root.innerHTML=html;let r=document.getElementById('range');if(r)r.oninput=()=>{if(q[4]===2)A.answers.budget=+r.value;else A.answers.time=+r.value;document.getElementById('v').textContent=r.value}}
function pick(k,v){let a=A.answers[k];if(v==='none')a=['none'];else{a=a.filter(x=>x!=='none');a.includes(v)?a=a.filter(x=>x!==v):a.push(v)}A.answers[k]=a;renderQ()}
function next(){let q=Q[A.step];if(q[4]===0)A.answers.ingredients=document.getElementById('ingredients').value;if(q[0]==='meals'&&!A.answers.meals.length)return toast('اختار على الأقل وجبة');if(q[0]==='allergies'&&A.answers.allergies.includes('none'))A.answers.allergies=['none'];if(A.step<Q.length-1){A.step++;renderQ()}else generate()}
async function generate(){root.innerHTML='<section class="screen center"><div class="mascot">✨</div><div class="loader"><div class="dots"><i></i><i></i><i></i></div></div><h1 class="title">نرتب لك الوصفات…</h1><p class="sub">نطابق المكونات، الحساسية، النظام، الأجهزة، الوقت والميزانية ونرتب النتائج.</p></section>';await new Promise(r=>setTimeout(r,700));let items=BASE.map((x,i)=>({id:'r'+i,title:x[0],meal:x[1],time:x[2],cost:Math.round(x[3]*(+A.answers.servings||2)/2),ingredients:x[4],labels:x[5],img:IMG[x[6]],score:rank(x)})).filter(x=>A.answers.meals.includes(x.meal)&&x.time<=A.answers.time&&x.cost<=A.answers.budget*1.15&&!unsafe(x)).sort((a,b)=>b.score-a.score);if(!items.length)items=BASE.map((x,i)=>({id:'r'+i,title:x[0],meal:x[1],time:x[2],cost:x[3],ingredients:x[4],labels:x[5],img:IMG[x[6]],score:10})).filter(x=>A.answers.meals.includes(x.meal));A.recipes=items;showResults()}
function rank(x){let s=40,ing=(A.answers.ingredients||'').toLowerCase();x.ingredients.forEach(i=>{if(ing.includes(i)||({'بطاطا':'potato','بطاطس':'potato','بطاطا':'potato','بيض':'egg','بصل':'onion','دجاج':'chicken','طماطم':'tomato','رز':'rice','أرز':'rice','عدس':'lentil'}[i]||'')&&ing.includes({'potato':'بطاطا','egg':'بيض','onion':'بصل','chicken':'دجاج','tomato':'طماطم','rice':'رز','lentil':'عدس'}[i]))s+=12});if(x.cost<=A.answers.budget)s+=12;if(x.time<=A.answers.time)s+=8;A.answers.diet.forEach(d=>{if(x.labels.includes(d))s+=15;if(d==='keto'&&x.ingredients.some(i=>['rice','pasta','flour','banana','bread'].includes(i)))s-=35;if(d==='vegan'&&x.ingredients.some(i=>['chicken','egg','tuna','milk'].includes(i)))s-=70;if(d==='vegetarian'&&x.ingredients.some(i=>['chicken','tuna'].includes(i)))s-=60});return s}
function unsafe(x){let a=A.answers.allergies;if(a.includes('none'))return false;return a.some(v=>v==='gluten'&&x.labels.includes('gluten'))||a.some(v=>v==='dairy'&&x.labels.includes('dairy'))||a.some(v=>v==='eggs'&&x.ingredients.includes('egg'))||a.some(v=>v==='seafood'&&x.ingredients.includes('tuna'))||a.some(v=>v==='peanuts'&&x.ingredients.includes('peanut'))||a.some(v=>v==='nuts'&&x.ingredients.includes('nuts'))||a.some(v=>v==='soy'&&x.ingredients.includes('soy'))}
function showResults(meal='all'){let a=meal==='all'?A.recipes:A.recipes.filter(x=>x.meal===meal);root.innerHTML='<section class="screen"><div class="resultsTop"><div><div class="eyebrow">✨ الخطة جاهزة</div><h1>اختياراتك</h1><div class="summary">'+A.answers.budget+' دج • حتى '+A.answers.time+' د • '+A.answers.servings+' أشخاص</div></div><button class="icon" onclick="start()">↻</button></div><div class="tabs"><button class="tab active" onclick="showResults(\'all\')">الكل</button>'+A.answers.meals.map(m=>'<button class="tab" onclick="showResults(\''+m+'\')">'+({breakfast:'🌅 الفطور',lunch:'☀️ الغداء',dinner:'🌙 العشاء'}[m])+'</button>').join('')+'</div><div class="grid">'+(a.length?a.map(card).join(''):'<div class="empty">ما لقيناش نتيجة مع كل الشروط. جرّب توسع الميزانية أو الوقت شوية.</div>')+'</div></section>'}
function card(x){return '<article class="card" onclick="openRecipe(\''+x.id+'\')" tabindex="0" onkeydown="if(event.key===\'Enter\')openRecipe(\''+x.id+'\')"><img src="'+x.img+'" loading="lazy" alt="صورة طبق"><div class="body"><div class="name">'+esc(x.title)+'</div><div class="tags"><span class="tag">⏱ '+x.time+' د</span><span class="tag">👥 '+A.answers.servings+'</span><span class="tag">✨ مناسب لفلترتك</span></div><div class="price">≈ '+x.cost+' دج</div><div class="match">مطابقة المكونات والوقت والميزانية والحساسية</div></div></article>'}
function openRecipe(id){let x=A.recipes.find(r=>r.id===id);if(!x)return;let saved=A.saved.includes(id);sheet.innerHTML='<div style="position:relative"><img src="'+x.img+'" alt="صورة '+esc(x.title)+'"><button class="close" onclick="closeModal()">✕</button></div><div class="sheetin"><div class="eyebrow">✨ وصفة مقترحة لك</div><h1>'+esc(x.title)+'</h1><div class="tags"><span class="tag">⏱ '+x.time+' دقيقة</span><span class="tag">💰 ≈ '+x.cost+' دج</span><span class="tag">👥 '+A.answers.servings+' أشخاص</span></div><h2>المكونات</h2><ul class="ing">'+x.ingredients.map((i,n)=>'<li><span>'+ingredientName(i)+'</span><b>'+((n%3)+1)+'</b></li>').join('')+'</ul><h2>الطريقة</h2><ol class="steps"><li>حضّر واغسل المكونات وقطّعها حسب الحاجة.</li><li>سخّن الأداة المناسبة ثم أضف المكونات بالترتيب.</li><li>اطبخ حتى تنضج المكونات جيداً، مع التحريك عند الحاجة.</li><li>ذوق وعدّل الملح والتوابل ثم قدّم الطبق.</li></ol><div class="note">⚠️ فحص الحساسية مبني على البيانات المتاحة للمكونات. في المنتجات المصنّعة، راجع الملصق دائماً إذا كانت الحساسية شديدة.</div><button class="primary" onclick="saveRecipe(\''+x.id+'\')">'+(saved?'❤️ محفوظة':'♡ حفظ الوصفة')+'</button></div>';modal.classList.add('open')}
function ingredientName(i){return ({chicken:'دجاج',potato:'بطاطا',carrot:'جزر',onion:'بصل',tomato:'طماطم',pepper:'فلفل',egg:'بيض',eggs:'بيض',bread:'خبز',herbs:'أعشاب',banana:'موز',flour:'فرينة',milk:'حليب',lentil:'عدس',rice:'أرز',peas:'جلبانة',tuna:'تونة',lettuce:'خس',pasta:'مقرونة',garlic:'ثوم',oil:'زيت',curry:'كاري',lemon:'ليمون',paprika:'بابريكا',zucchini:'كوسة'})[i]||i}
function closeModal(){modal.classList.remove('open')};function saveRecipe(id){let i=A.saved.indexOf(id);if(i>=0)A.saved.splice(i,1);else A.saved.push(id);localStorage.setItem('mdz_saved',JSON.stringify(A.saved));closeModal();toast(i>=0?'تحيدات من المحفوظات':'تحفظات ❤️')}
function showSaved(){let a=A.recipes.filter(x=>A.saved.includes(x.id));root.innerHTML='<section class="screen"><h1>المحفوظات ❤️</h1><p class="sub">وصفاتك الخاصة.</p><div class="grid">'+(a.length?a.map(card).join(''):'<div class="empty">مازال ما حفظت حتى وصفة.<br>اضغط على أي وصفة باش تحفظها.</div>')+'</div></section>'}
function goSearch(){toast('البحث الذكي الكامل سيكون فوق قاعدة الوصفات الكبيرة 🔎')};function toast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)}home();
</script></body></html>
