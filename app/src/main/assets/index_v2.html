function ingredientUI(){return `<div class="field"><textarea id="ingredients" rows="4" placeholder="مثال: بطاطا، oeufs، بصل، chicken...">${esc(A.answers.ingredients)}</textarea></div><p class="sub" style="font-size:11px;margin-top:10px">يفهم العربية، الدارجة، الفرنسية، الإنجليزية والخلط بينهم.</p>`}
function budgetUI(){return `<div style="width:100%;text-align:center"><div class="budget"><span id="budgetValue">${A.answers.budget}</span> <small>دج</small></div><input id="budget" class="slider" type="range" min="150" max="3000" step="50" value="${A.answers.budget}"><div class="range"><span>150 دج</span><span>3000 دج</span></div><div class="chips"><button class="chip" data-budget="300">اقتصادي</button><button class="chip" data-budget="500">متوسط</button><button class="chip" data-budget="1000">مريح</button></div></div>`}
function timeUI(){return `<div style="width:100%;text-align:center"><div class="budget"><span id="timeValue">${A.answers.time}</span> <small>دقيقة</small></div><input id="time" class="slider" type="range" min="10" max="120" step="5" value="${A.answers.time}"><div class="range"><span>10 د</span><span>120 د</span></div></div>`}
function servingUI(){return `<div class="choices">${Q.find(x=>x.id==='servings').opts.map(o=>`<button class="choice ${String(A.answers.servings)===o[2]?'sel':''}" data-serving="${o[2]}"><span class="ico">${o[0]}</span><b>${o[1]}</b><span class="check">${String(A.answers.servings)===o[2]?'✓':''}</span></button>`).join('')}</div>`}
function bindQuiz(q){document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{b.classList.remove('flash');void b.offsetWidth;b.classList.add('flash');const v=b.dataset.v;if(q.id==='meals'||q.id==='diet'||q.id==='allergies'||q.id==='equipment'){const s=A.answers[q.id];if(v==='normal'){s.clear()}else if(v==='none'){s.clear();s.add('none')}else if(s.has(v))s.delete(v);else{s.delete('none');s.add(v)}quiz()}else if(q.id==='servings'){A.answers.servings=+b.dataset.serving;quiz()}});const ing=document.getElementById('ingredients');if(ing)ing.oninput=()=>A.answers.ingredients=ing.value;const bud=document.getElementById('budget');if(bud)bud.oninput=()=>{A.answers.budget=+bud.value;document.getElementById('budgetValue').textContent=bud.value};document.querySelectorAll('[data-budget]').forEach(x=>x.onclick=()=>{A.answers.budget=+x.dataset.budget;quiz()});const time=document.getElementById('time');if(time)time.oninput=()=>{A.answers.time=+time.value;document.getElementById('timeValue').textContent=time.value};document.getElementById('next').onclick=()=>{if(q.id==='meals'&&A.answers.meals.size===0){toast('اختار وجبة وحدة على الأقل');return}if(A.step===Q.length-1){generatePlan();return}A.step++;quiz()};document.getElementById('skip').onclick=()=>{if(A.step>0){A.step--;quiz()}else home()}}
function normalizeIngredients(s){return s.toLowerCase().split(/[,،;\n]+/).map(x=>x.trim()).filter(Boolean).map(x=>alias[x]||x).filter(Boolean)}
function score(r){const a=A.answers;let score=0;if(!a.meals.has(r.meal))return -999;if(r.time<=a.time)score+=25;else score-=40;if(r.cost<=a.budget)score+=25;else score-=45;const bad=[...a.allergies].filter(x=>x!=='none');if(bad.some(x=>r.all.includes(x)))return -999;const desired=[...a.diet].filter(x=>x!=='normal');for(const d of desired){if(dietMap[d]?.some(x=>r.diet.includes(x)))score+=18;else if(d==='halal'&&!r.diet.includes('halal'))score-=18;else if(d!=='normal')score-=7}const have=normalizeIngredients(a.ingredients);if(have.length){const hits=r.ings.filter(i=>have.includes(i)).length;score+=Math.round(hits/r.ings.length*35)}if(a.equipment.size){if(r.eq.length===0)score+=7;else if(r.eq.every(e=>a.equipment.has(e)))score+=12;else score-=25}score+=Math.max(0,15-Math.abs(a.budget-r.cost)/40);return score}
function generatePlan(){A.view='loading';setNav('plan');root.innerHTML=`<section class="screen center loading"><div class="hero">🍲</div><div class="loaderOrb"></div><div class="loaderText">نرتبلك الخطة...</div><p class="loaderSub">نطابق الوقت، الميزانية، الحساسية، الأدوات، المكونات والوجبات.<br>ونفهم حتى خلط العربية + الدارجة + français + English.</p><div class="dots"><i></i><i></i><i></i></div></section>`;setTimeout(()=>{const pool=R.map((r,i)=>({...r,id:i,s:score(r)})).filter(r=>r.s>-100).sort((a,b)=>b.s-a.s);A.results=pool;A.plan=[...A.answers.meals].map(m=>pool.find(r=>r.meal===m)).filter(Boolean);showPlan()},520)}
function showPlan(){A.view='plan';setNav('plan');const cards=A.plan.length?A.plan:A.results.slice(0,3);root.innerHTML=`<section class="screen"><div class="resultsHead"><div><h1>خطة اليوم ✨</h1><p>${cards.length} اقتراحات مطابقة لاختياراتك</p></div><button class="icon" onclick="start()">⚙</button></div><div class="filterRow"><button class="filter active" onclick="showPlan()">مطابق لك</button><button class="filter" onclick="library()">كل المكتبة</button></div><div class="library">${cards.map(card).join('')}</div></section>`}
function card(r){return `<article class="card" onclick="openRecipe(${r.id})"><img class="photo" loading="lazy" src="${photos[r.img]}" onerror="this.style.display='none'" alt="${esc(r.t)}"><div class="cardBody"><button class="heart" onclick="event.stopPropagation();toggleSave(${r.id})">${A.saved.includes(r.id)?'♥':'♡'}</button><div class="cardTitle">${esc(r.t)}</div><div class="meta"><span class="tag">⏱ ${r.time} د</span>${r.tags.slice(0,3).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div><div class="cost">≈ ${r.cost} دج</div><div class="match">${matchText(r)}</div></div></article>`}
function matchText(r){const have=normalizeIngredients(A.answers.ingredients);const hits=r.ings.filter(x=>have.includes(x)).length;return hits?`يستعمل ${hits} من المكونات اللي عندك`:'مطابق للوقت والميزانية والاختيارات'}
function library(){A.view='library';setNav('plan');A.results=R.map((r,i)=>({...r,id:i}));root.innerHTML=`<section class="screen"><div class="resultsHead"><div><h1>${L[A.lang].library}</h1><p>${R.length}+ وصفات جاهزة للتصنيف والتوسعة</p></div></div><div class="filterRow"><button class="filter active">الكل</button><button class="filter" onclick="quickFilter('breakfast')">فطور</button><button class="filter" onclick="quickFilter('lunch')">غداء</button><button class="filter" onclick="quickFilter('dinner')">عشاء</button><button class="filter" onclick="quickFilter('vegan')">Vegan</button><button class="filter" onclick="quickFilter('gluten-free')">بلا غلوتين</button></div><div class="library">${A.results.map(card).join('')}</div></section>`}
function quickFilter(x){A.results=R.map((r,i)=>({...r,id:i})).filter(r=>r.meal===x||r.diet.includes(x));document.querySelector('.library').innerHTML=A.results.map(card).join('')}
function openRecipe(id){const r=R[id];if(!r)return;const safe=r.all.length?'تحقق من مكونات المنتجات المركبة وملصقها إذا كانت لديك حساسية.':'لا توجد حساسية معروفة في بيانات هذه الوصفة.';sheet.innerHTML=`<button class="close" onclick="closeModal()">×</button><img class="sheetPhoto" src="${photos[r.img]}" onerror="this.style.display='none'"><div class="sheetIn"><h1>${esc(r.t)}</h1><div class="meta"><span class="tag">⏱ ${r.time} دقيقة</span><span class="tag">≈ ${r.cost} دج</span><span class="tag">${r.diet.includes('high-protein')?'بروتين عالي':'وصفة يومية'}</span></div><h2>المكونات</h2><ul class="ing">${r.ings.map(i=>`<li><span>${ingredientName(i)}</span><b>حسب الحصة</b></li>`).join('')}</ul><h2>الطريقة</h2><ol class="steps"><li>حضّر المكونات وقطعها بالحجم المناسب.</li><li>سخّن الأداة المناسبة ثم اطبخ المكونات بالترتيب.</li><li>تأكد من النضج والتتبيل ثم قدّمها مباشرة.</li></ol><h2>ملاحظات السلامة</h2><div class="note">${safe}<br>التصنيف الغذائي تقديري ولا يعوض قراءة الملصق أو نصيحة مختص عند وجود حساسية شديدة.</div><button class="primary" onclick="toggleSave(${id});closeModal()">${A.saved.includes(id)?'إزالة من المحفوظات':'حفظ الوصفة'} ♡</button></div>`;modal.classList.add('open')}
function ingredientName(i){const m={potato:'بطاطا',egg:'بيض',eggs:'بيض',chicken:'دجاج',onion:'بصل',tomato:'طماطم',pepper:'فلفل',rice:'أرز',lentil:'عدس',milk:'حليب',cheese:'جبن',bread:'خبز',chickpeas:'حمص',tuna:'تونة',carrot:'جزر',garlic:'ثوم',banana:'موز',flour:'فرينة'};return m[i]||i}
function closeModal(){modal.classList.remove('open')}
function toggleSave(id){if(A.saved.includes(id))A.saved=A.saved.filter(x=>x!==id);else A.saved.push(id);localStorage.setItem('mdz_saved_v3',JSON.stringify(A.saved));toast(A.saved.includes(id)?'تحفظت الوصفة ❤️':'تحيدات من المحفوظات');if(A.view==='plan')showPlan();else if(A.view==='library')library()}
function showSaved(){A.view='saved';setNav('saved');const rr=A.saved.map(id=>R[id]).filter(Boolean);root.innerHTML=`<section class="screen"><div class="resultsHead"><div><h1>${L[A.lang].saved}</h1><p>${rr.length} وصفات محفوظة</p></div></div><div class="library">${rr.length?rr.map(r=>card({...r,id:R.indexOf(r)})).join(''):'<div class="empty">مازال ما حفظت حتى وصفة.<br>اضغط ♡ على أي وصفة باش تلقاها هنا.</div>'}</div></section>`}
function search(){const q=prompt('اكتب: دجاج / chicken / poulet / بطاطا...');if(!q)return;const n=normalizeIngredients(q);const rr=R.map((r,i)=>({...r,id:i,s:r.t.toLowerCase().includes(q.toLowerCase())?50:r.ings.filter(x=>n.includes(x)).length*20})).filter(r=>r.s>0).sort((a,b)=>b.s-a.s);A.results=rr;A.view='library';setNav('plan');root.innerHTML=`<section class="screen"><div class="resultsHead"><div><h1>نتائج البحث</h1><p>${rr.length} وصفات</p></div></div><div class="library">${rr.length?rr.map(card).join(''):'<div class="empty">ما لقيتش وصفة مطابقة. جرّب اسم مكوّن أو كلمة بالدارجة.</div>'}</div></section>`}
document.getElementById('back').onclick=()=>{if(A.view==='quiz'){if(A.step>0){A.step--;quiz()}else home()}else home()};document.getElementById('searchBtn').onclick=search;document.querySelectorAll('.nav').forEach(n=>n.onclick=()=>{const v=n.dataset.nav;if(v==='home')home();else if(v==='plan')start();else if(v==='saved')showSaved();else toast('قائمة المشتريات تتبنى من وصفاتك المحفوظة 🛒')});modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});home();
</script></body></html>
