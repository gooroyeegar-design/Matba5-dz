function render(){const r=document.getElementById('root');if(A.view==='home')return home();if(A.view==='test')return test();if(A.view==='loading')return loading();if(A.view==='results')return results();if(A.view==='library')return library();if(A.view==='plan')return plan();if(A.view==='saved')return saved()}
function home(){root.innerHTML=`<section class="screen center"><div class="hero"><div class="orb"></div><span class="steam">♨</span><span class="steam s2">♨</span><span class="steam s3">♨</span><div class="pot"><div class="face">•ᴗ•</div></div></div><div class="eyebrow">مطبخك الذكي</div><h1 class="title">واش نطيب اليوم؟</h1><p class="sub">خلي MATBAK DZ يفهم ميزانيتك، ذوقك، مكوناتك والوقت اللي عندك ويصنعلك خطة مناسبة.</p><button class="primary" onclick="start()">نبداو الخطة ✨</button><button class="secondary" onclick="showLibrary()">شوف مكتبة الوصفات · ${RECIPES.length.toLocaleString('ar-DZ')}</button></section>`}
function test(){const q=Q[A.step],p=Math.round((A.step/Q.length)*100);let body='';if(q.opts)body=`<div class="choices">${q.opts.map(o=>`<button class="choice ${A.answers[q.key].has(o[2])?'sel':''}" onclick="toggle('${q.key}','${o[2]}',this)"><span class="shine"></span><span class="emoji">${o[0]}</span><b>${o[1]}</b><small>${A.answers[q.key].has(o[2])?'مختار':''}</small><span class="check">${A.answers[q.key].has(o[2])?'✓':''}</span></button>`).join('')}</div>`;if(q.budget)body=`<div class="budget">${A.answers.budget}<small> دج</small></div><input class="slider" type="range" min="150" max="3000" step="50" value="${A.answers.budget}" oninput="A.answers.budget=+this.value;render()"><div class="range"><span>150</span><span>3000 دج</span></div><div class="chips">${[300,500,800,1200,2000].map(x=>`<button class="chip ${A.answers.budget===x?'on':''}" onclick="A.answers.budget=${x};render()">${x} دج</button>`).join('')}</div>`;if(q.time)body=`<div class="budget">${A.answers.time}<small> دقيقة</small></div><input class="slider" type="range" min="10" max="120" step="5" value="${A.answers.time}" oninput="A.answers.time=+this.value;render()"><div class="range"><span>10 د</span><span>120 د</span></div>`;if(q.text)body=`<div class="field"><input id="ingInput" value="${esc(A.answers.ingredients)}" placeholder="بطاطا، بيض، بصل / pommes de terre..."></div><div class="chips"><button class="chip" onclick="A.answers.ingredients='بطاطا، بيض، بصل';render()">مثال جزائري</button><button class="chip" onclick="A.answers.ingredients='chicken, rice, garlic';render()">English</button><button class="chip" onclick="A.answers.ingredients='poulet, riz, oignon';render()">Français</button></div>`;if(q.servings)body=`<div class="budget">${A.answers.servings}<small> أشخاص</small></div><input class="slider" type="range" min="1" max="10" value="${A.answers.servings}" oninput="A.answers.servings=+this.value;render()"><div class="range"><span>1</span><span>10</span></div>`;root.innerHTML=`<section class="screen"><div class="progress"><i style="width:${p}%"></i></div><div class="eyebrow">السؤال ${A.step+1} من ${Q.length}</div><h1 class="title">${q.title}</h1><p class="sub" style="text-align:right">${q.sub}</p>${body}<button class="primary" onclick="next()">التالي ${A.step===Q.length-1?'🍲':'→'}</button></section>`}
function start(){A.step=0;A.view='test';render()}function toggle(k,v,el){A.answers[k].has(v)?A.answers[k].delete(v):A.answers[k].add(v);el.classList.add('flash');setTimeout(render,260)}
function next(){if(Q[A.step].text)A.answers.ingredients=document.getElementById('ingInput')?.value||'';if(A.step<Q.length-1){A.step++;render()}else{A.view='loading';render();setTimeout(buildPlan,650)}}
function buildPlan(){const a=A.answers,wants=[...a.meals],text=a.ingredients.toLowerCase(),terms=text.split(/[,\s،]+/).filter(Boolean);let scored=RECIPES.map(r=>{let s=0;if(wants.includes(r.type))s+=35;else s-=22;if(a.diet.size&&[...a.diet].some(d=>r.tags.includes(d)))s+=24;if(r.time<=a.time)s+=18;else s-=Math.min(24,(r.time-a.time)/2);if(r.cost<=a.budget)s+=20;else s-=Math.min(30,(r.cost-a.budget)/30);if(terms.length){let hits=r.ingredients.filter(i=>terms.some(t0=>[i.id,i.name,...(canon[i.id]||[])].some(z=>z.toLowerCase().includes(t0)))).length;s+=Math.min(30,hits*10)}if([...a.allergies].some(x=>r.allergens.includes(x)))s=-999;return[s,r]}).filter(x=>x[0]>-900).sort((x,y)=>y[0]-x[0]);A.results=scored.slice(0,24).map(x=>x[1]);const seen=new Set(JSON.parse(localStorage.getItem('mdz_collected_v4')||'[]'));A.results.forEach(r=>seen.add(r.id));localStorage.setItem('mdz_collected_v4',JSON.stringify([...seen]));A.plan=wants.map(m=>A.results.find(r=>r.type===m)||A.results[0]).filter(Boolean);A.view='results';render()}
function loading(){root.innerHTML=`<section class="screen loading"><div class="cookScene"><span class="spark sp1">✦</span><span class="spark sp2">✦</span><div class="bubble b1"></div><div class="bubble b2"></div><div class="bubble b3"></div><div class="cookPot"></div></div><h2>نوجدلك المائدة... 🍲</h2><p>نطابق الوقت، الميزانية، الحساسية، الأدوات والمكونات ونرتبلك أحسن الاختيارات.</p><div class="dots"><i></i><i></i><i></i></div></section>`}
function results(){root.innerHTML=`<section class="screen"><div class="libraryHead"><div><div class="eyebrow">خطة شخصية</div><h1>هادو يجو عليك ✨</h1></div><div class="count">${A.results.length} وصفة</div></div><div class="filterRow"><button class="filter on">الكل</button><button class="filter">أقل من ${A.answers.time}د</button><button class="filter">≤ ${A.answers.budget} دج</button><button class="filter">مكوناتك</button></div><div class="library">${A.results.map(card).join('')}</div></section>`}
function library(){root.innerHTML=`<section class="screen"><div class="libraryHead"><div><div class="eyebrow">قاعدة MATBAK DZ</div><h1>مكتبة الوصفات</h1></div><div class="count">${RECIPES.length.toLocaleString('ar-DZ')}+</div></div><div class="field"><input placeholder="ابحث: دجاج، couscous، recette poulet..." oninput="searchLib(this.value)"></div><div id="libList" class="library" style="margin-top:14px">${RECIPES.slice(0,30).map(card).join('')}</div></section>`}
function searchLib(v){let q=v.toLowerCase().trim(),arr=q?RECIPES.filter(r=>(r.title+' '+r.base+' '+r.variant+' '+r.ingredients.map(x=>x.name).join(' ')).toLowerCase().includes(q)):RECIPES.slice(0,30);document.getElementById('libList').innerHTML=arr.slice(0,60).map(card).join('')}
function card(r){let saved=A.saved.includes(r.id);return `<article class="card" onclick="openRecipe('${r.id}')"><img class="photo" src="${r.image}" alt="${esc(r.title)}" loading="lazy" onerror="this.src='${IMG.salad}'"><div class="cardBody"><button class="heart" onclick="event.stopPropagation();saveRecipe('${r.id}')">${saved?'♥':'♡'}</button><div class="cardTitle">${esc(r.title)}</div><div class="meta"><span class="tag">⏱ ${r.time} د</span><span class="tag">👥 ${A.answers.servings}</span><span class="tag">${esc(r.variant)}</span></div><div class="cost">${r.cost} دج تقريباً</div><div class="match">${r.ingredients.slice(0,4).map(x=>x.name).join(' · ')}</div></div></article>`}
function openRecipe(id){let r=RECIPES.find(x=>x.id===id);if(!r)return;document.getElementById('sheet').innerHTML=`<button class="close" onclick="closeModal()">×</button><img class="sheetPhoto" src="${r.image}" alt="${esc(r.title)}"><div class="sheetIn"><div class="eyebrow">${r.variant} · ${r.time} دقيقة · ${r.cost} دج</div><h1>${esc(r.title)}</h1><p class="sub" style="text-align:right">وصفة منظمة حسب المكونات، الوقت والميزانية.</p><h2>المكونات</h2><ul class="ing">${r.ingredients.map(i=>`<li><span>${i.name}</span><b>${i.qty} ${i.unit}</b></li>`).join('')}</ul><h2>الطريقة</h2><ol class="steps">${r.steps.map(s=>`<li>${s}</li>`).join('')}</ol><h2>ملاحظات</h2><div class="note">${esc(r.notes)}</div><button class="primary" onclick="saveRecipe('${r.id}');closeModal()">حفظ في مكتبتي ♡</button></div>`;document.getElementById('modal').classList.add('open')}
function closeModal(){document.getElementById('modal').classList.remove('open')}function saveRecipe(id){let i=A.saved.indexOf(id);i>=0?A.saved.splice(i,1):A.saved.push(id);localStorage.setItem('mdz_saved_v4',JSON.stringify(A.saved));toast(i>=0?'تحيدات من المحفوظات':'تحفظات في مكتبتك ✨');render()}
function saved(){let arr=RECIPES.filter(r=>A.saved.includes(r.id));root.innerHTML=`<section class="screen"><div class="libraryHead"><div><div class="eyebrow">خاص بيك</div><h1>المحفوظات</h1></div><div class="count">${arr.length}</div></div><div class="library">${arr.length?arr.map(card).join(''):'<div class="note">مازال ما حفظت حتى وصفة. اختار وصفة واضغط ♡.</div>'}</div></section>`}
function plan(){if(!A.plan.length){start();return}root.innerHTML=`<section class="screen"><div class="libraryHead"><div><div class="eyebrow">حسب اختياراتك</div><h1>خطتي 🍽️</h1></div></div><div class="library">${A.plan.map(card).join('')}</div><button class="primary" onclick="start()">بدّل الخطة</button></section>`}
function showLibrary(){A.view='library';render()}function toast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});document.getElementById('back').onclick=()=>{if(A.view==='test'&&A.step>0){A.step--;render()}else if(A.view!=='home'){A.view='home';render()}};document.getElementById('libraryBtn').onclick=showLibrary;document.querySelectorAll('.nav').forEach(n=>n.onclick=()=>{document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));n.classList.add('active');A.view=n.dataset.nav==='home'?'home':n.dataset.nav;render()});render();
</script></body></html>
