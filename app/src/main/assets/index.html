<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MATBAK DZ</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#fffaf5;color:#241a12}header{padding:28px 20px 18px;background:linear-gradient(145deg,#fff1df,#fffaf5)}h1{margin:0;font-size:31px}p{color:#806f61}.search{display:flex;background:white;border:1px solid #eadfd4;border-radius:18px;padding:5px;margin-top:18px;box-shadow:0 8px 25px #0000000a}.search input{border:0;outline:0;flex:1;padding:13px;font-size:16px;background:transparent}.search button{border:0;border-radius:14px;background:#d97706;color:white;padding:0 18px;font-size:20px}.chips{display:flex;gap:8px;overflow:auto;padding:16px 0}.chip{white-space:nowrap;border:1px solid #eadfd4;background:#fff;border-radius:30px;padding:9px 14px}.hero{margin:4px 16px 18px;padding:20px;border-radius:24px;background:#2f241d;color:white}.hero b{font-size:22px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:0 16px 100px}.card{background:#fff;border:1px solid #eee3d9;border-radius:20px;overflow:hidden;box-shadow:0 5px 18px #00000008}.photo{height:125px;background:linear-gradient(135deg,#f5c27a,#c86b36);display:grid;place-items:center;font-size:48px}.body{padding:12px}.body h3{margin:0 0 5px;font-size:17px}.meta{font-size:12px;color:#89786a}.cost{color:#a84e00;font-weight:700;margin-top:7px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #eadfd4;display:flex;justify-content:space-around;padding:10px 4px calc(10px + env(safe-area-inset-bottom));z-index:5}.nav{font-size:12px;color:#806f61;text-align:center}.nav b{display:block;font-size:21px}.empty{display:none;padding:40px;text-align:center;color:#806f61}.section{padding:0 16px}.small{font-size:13px}</style></head><body><header><div class="small">🇩🇿 مصمم للجزائر • MATBAK DZ</div><h1>واش نطيب اليوم؟ 🍲</h1><p>أكثر من مجرد وصفات — مساعدك للأكل، الميزانية والمكونات.</p><div class="search"><input id="q" placeholder="دجاج، بطاطا، recette poulet…"><button onclick="search()">⌕</button></div><div class="chips"><button class="chip" onclick="filter('الجزائر')">🇩🇿 جزائري</button><button class="chip" onclick="filter('20')">⚡ أقل من 20 دقيقة</button><button class="chip" onclick="filter('gluten')">🌾 بلا غلوتين</button><button class="chip" onclick="filter('dairy')">🥛 بلا حليب</button><button class="chip" onclick="filter('budget')">💰 اقتصادي</button></div></header><div class="hero"><b>عندك مكونات؟</b><div>اكتب واش كاين عندك ونلقاو لك الوصفات المناسبة.</div></div><div class="section"><h2>اقتراحات ليومك</h2></div><main id="grid" class="grid"></main><div id="empty" class="empty">ما لقيناش وصفة مطابقة. جرّب كلمات أخرى أو مكونات أكثر.</div><div class="bottom"><div class="nav"><b>⌂</b>الرئيسية</div><div class="nav" onclick="document.getElementById('q').focus()"><b>⌕</b>البحث</div><div class="nav"><b>♡</b>المفضلة</div><div class="nav"><b>🛒</b>المشتريات</div><div class="nav"><b>☰</b>المزيد</div></div><script>const recipes=[{t:'كسكس جزائري بالدجاج',e:'🍛',c:'الجزائر',time:55,cost:620,tags:'algeria chicken budget'},{t:'شخشوخة بسكرة',e:'🥘',c:'الجزائر',time:50,cost:700,tags:'algeria'},{t:'مقرود بالتمر',e:'🍪',c:'الجزائر',time:45,cost:450,tags:'algeria dessert'},{t:'شوربة عدس',e:'🍲',c:'الشرق الأوسط',time:25,cost:180,tags:'gluten dairy budget'},{t:'دجاج بالليمون',e:'🍗',c:'عالمي',time:20,cost:520,tags:'chicken 20'},{t:'شكشوكة',e:'🍳',c:'المغرب العربي',time:15,cost:240,tags:'egg tomato 20 gluten dairy'},{t:'سلطة تونة',e:'🥗',c:'عالمي',time:10,cost:480,tags:'fish 20 gluten dairy high protein'},{t:'باستا كريمية',e:'🍝',c:'إيطاليا',time:25,cost:650,tags:'pasta dairy'},{t:'أرز بالخضار',e:'🍚',c:'آسيا',time:20,cost:300,tags:'rice vegan gluten dairy 20'},{t:'حريرة مغربية',e:'🍲',c:'المغرب',time:60,cost:500,tags:'morocco'},{t:'بان كيك',e:'🥞',c:'عالمي',time:15,cost:220,tags:'breakfast dairy gluten 20'},{t:'دجاج بالكاري',e:'🍛',c:'الهند',time:35,cost:700,tags:'chicken india'}];function render(a){grid.innerHTML=a.map(r=>`<article class="card"><div class="photo">${r.e}</div><div class="body"><h3>${r.t}</h3><div class="meta">${r.c} • ${r.time} دقيقة</div><div class="cost">≈ ${r.cost} دج</div></div></article>`).join('');empty.style.display=a.length?'none':'block'}function search(){let q=document.getElementById('q').value.trim().toLowerCase();if(!q)return render(recipes);render(recipes.filter(r=>(r.t+' '+r.c+' '+r.tags).toLowerCase().includes(q)|| (q.includes('دجاج')&&r.tags.includes('chicken'))||(q.includes('بطاط')&&r.t.includes('بطاط'))))}function filter(x){render(recipes.filter(r=>r.tags.includes(x)||r.time<=+x||r.cost<=500))}render(recipes)</script></body></html>
