<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MATBAK DZ</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#263126;background:#fbfff6}body{overflow-x:hidden}.app{min-height:100vh;background:radial-gradient(circle at 15% 5%,#fff9c9 0,#f6ffe8 28%,#f7fff6 58%,#fff5ff 100%)}
.top{height:58px;display:flex;align-items:center;justify-content:space-between;padding:12px 18px;color:#263126}.brand{font-weight:900;letter-spacing:.4px;font-size:17px}.back,.search{border:0;background:transparent;font-size:23px;color:#354238}.screen{min-height:calc(100vh - 58px);padding:12px 22px 28px;display:flex;flex-direction:column}.center{text-align:center;align-items:center}.progress{height:6px;border-radius:9px;background:#e5eddc;overflow:hidden;margin:0 4px 28px}.progress i{display:block;height:100%;background:#67d38a;border-radius:9px;transition:width .35s}.mascot{width:105px;height:105px;border-radius:46% 46% 44% 44%;background:linear-gradient(145deg,#fff,#eaffd5);box-shadow:0 14px 35px #7ecf6a35;position:relative;margin:8px auto 22px}.mascot:before{content:'🍲';position:absolute;font-size:54px;left:25px;top:22px}.mascot:after{content:'';position:absolute;width:30px;height:12px;background:#fff;border-radius:50%;top:8px;left:38px;box-shadow:0 2px 0 #dfe8d5}.eyebrow{font-size:13px;color:#748171;margin-bottom:10px}.title{font-size:25px;line-height:1.22;margin:0 0 10px;font-weight:850}.sub{color:#778274;line-height:1.55;margin:0 auto 25px;max-width:330px}.choices{width:100%;display:grid;gap:11px}.choice{border:1.5px solid #dfe9d9;background:#fff;border-radius:18px;padding:15px 16px;text-align:right;display:flex;align-items:center;justify-content:space-between;font-size:16px;box-shadow:0 6px 18px #455c3b0a;transition:.2s}.choice.sel{border-color:#67d38a;background:#f0fff1;box-shadow:0 8px 22px #67d38a25}.choice small{display:block;color:#899386;font-size:12px;margin-top:3px}.icon{font-size:24px;margin-left:10px}.check{width:23px;height:23px;border:2px solid #ccd8c7;border-radius:50%;display:grid;place-items:center;color:white;font-size:14px}.sel .check{background:#63cf88;border-color:#63cf88}.btn{margin-top:auto;width:100%;border:0;border-radius:18px;padding:16px;font-weight:800;font-size:16px;background:linear-gradient(90deg,#64d889,#4cc97a);color:#fff;box-shadow:0 10px 24px #57ce8235}.btn:disabled{opacity:.42;box-shadow:none}.budget{font-size:47px;font-weight:900;margin:12px 0}.budget small{font-size:20px;color:#70806f}.slider{width:100%;accent-color:#64d889}.range{display:flex;justify-content:space-between;color:#7d8979;font-size:12px}.pills{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin:12px 0}.pill{border:1px solid #dfe8dc;border-radius:30px;background:#fff;padding:9px 13px}.pill.sel{background:#ecfff0;border-color:#62cf86}.loading{font-size:23px;font-weight:800;margin:15px}.ring{width:150px;height:150px;border-radius:50%;background:conic-gradient(#63d38b var(--p),#e7f0e1 0);display:grid;place-items:center;margin:28px auto;position:relative}.ring:after{content:'';position:absolute;inset:13px;border-radius:50%;background:#f8fff5}.ring b{position:relative;z-index:1;font-size:28px}.mealday{background:#fff;border:1px solid #e5eddf;border-radius:20px;padding:13px;margin-bottom:12px;box-shadow:0 7px 22px #475b4108}.day{font-weight:850;margin-bottom:9px}.meal{display:flex;gap:10px;align-items:center;padding:8px 0}.meal .pic{width:55px;height:55px;border-radius:15px;display:grid;place-items:center;font-size:28px;background:linear-gradient(135deg,#fff2b6,#dcffd7)}.meal h4{margin:0;font-size:14px}.meal p{margin:4px 0 0;color:#7a8777;font-size:11px}.price{margin-right:auto;font-weight:800;color:#4a9f64;font-size:12px}.summary{width:100%;background:#ffffffb8;border:1px solid #e1eadb;border-radius:20px;padding:14px;margin:8px 0 16px}.row{display:flex;justify-content:space-between;padding:7px 0;color:#697668}.row b{color:#263126}.note{font-size:12px;color:#7b8878;line-height:1.5;margin-top:12px}.hidden{display:none!important}
</style></head>
<body><div class="app"><div class="top"><button class="back" id="back">‹</button><div class="brand">MATBAK DZ 🇩🇿</div><button class="search" onclick="goSearch()">⌕</button></div><div id="root"></div></div>
<script>
const state={step:0,store:null,cal:2000,diets:new Set(),meals:new Set(['breakfast','lunch','dinner']),tools:new Set(),budget:500,query:''};
const recipes=[
 {t:'شكشوكة جزائرية',e:'🍳',type:'breakfast',c:'الجزائر',time:18,cost:180,tags:['halal','gluten-free','dairy-free','budget'],need:['pan']},
 {t:'كسكس بالدجاج والخضر',e:'🍛',type:'lunch',c:'الجزائر',time:55,cost:620,tags:['halal','high-protein'],need:['pot','steamer']},
 {t:'شوربة عدس',e:'🍲',type:'dinner',c:'الجزائر',time:28,cost:190,tags:['vegan','gluten-free','dairy-free','budget'],need:['pot','blender']},
 {t:'دجاج بالليمون',e:'🍗',type:'dinner',c:'عالمي',time:22,cost:520,tags:['halal','high-protein','dairy-free'],need:['pan']},
 {t:'سلطة تونة وبطاطا',e:'🥗',type:'lunch',c:'المتوسط',time:15,cost:430,tags:['halal','gluten-free','dairy-free','high-protein'],need:['pot']},
 {t:'أرز بالخضر',e:'🍚',type:'lunch',c:'آسيا',time:20,cost:300,tags:['vegan','gluten-free','dairy-free','budget'],need:['pan']},
 {t:'بان كيك بالشوفان',e:'🥞',type:'breakfast',c:'عالمي',time:15,cost:240,tags:['vegetarian'],need:['pan']},
 {t:'طاجين الزيتون بالدجاج',e:'🍲',type:'dinner',c:'الجزائر',time:50,cost:680,tags:['halal','high-protein'],need:['oven','pot']}
];
const stepData=[
 {q:'وين تحب تشري؟',sub:'نستعمل الأسعار المحلية باش نحسب لك الميزانية بشكل واقعي.',opts:[['🛒','سوبرماركت','أسعار التجزئة'],['🏪','محلات الحي','أسعار محلية'],['🥬','السوق','أسعار السوق'] ],key:'store'},
 {q:'شحال تحب من السعرات في اليوم؟',sub:'تقدر تبدل هذا لاحقاً. السعرات تقديرية وليست نصيحة طبية.',cal:true},
 {q:'كاين حاجة ما تقدرش تاكلها؟',sub:'اختار كل ما ينطبق عليك. الحساسية تُعامل كاستبعاد صارم.',opts:[['🌾','بلا غلوتين','Gluten-free'],['🥛','بلا حليب','Dairy-free'],['🥬','نباتي','Vegetarian'],['💪','عالي البروتين','High protein'],['☪️','حلال','Halal']],multi:true,key:'diets'},
 {q:'وش من وجبات تحب نوجدلك؟',sub:'نقدر نوجد وجبة وحدة، زوج، ولا نهار كامل.',opts:[['🌅','الفطور','Breakfast'],['☀️','الغداء','Lunch'],['🌙','العشاء','Dinner']],multi:true,key:'meals'},
 {q:'وش كاين عندك في الكوزينة؟',sub:'باش ما نقترحش وصفة تحتاج جهاز ما عندكش.',opts:[['🔥','فرن','oven'],['🍟','Air fryer','airfryer'],['🍳','طاجين/قدر','pot'],['🥤','خلاط','blender'],['🥄','مقلاة','pan'],['♨️','كسكاس','steamer']],multi:true,key:'tools'},
 {q:'شحال الميزانية؟',sub:'الأسعار تقريبية بالدينار الجزائري وتتحدث من بيانات الأسعار المتاحة.',budget:true}
];
function esc(s){return String(s).replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\\':'&#39;'}[m]))}
function render(){const r=document.getElementById('root'); if(state.step<6){const d=stepData[state.step];r.innerHTML=`<main class="screen center"><div class="progress"><i style="width:${Math.round((state.step/6)*100)}%"></i></div><div class="mascot"></div><div class="eyebrow">${state.step+1} من 6</div><h1 class="title">${d.q}</h1><p class="sub">${d.sub}</p>${d.cal?calUI():d.budget?budgetUI():optsUI(d)}<button class="btn" id="next">متابعة</button></main>`;bind();}else if(state.step===6){buildUI();}}
function optsUI(d){return `<div class="choices">${d.opts.map((o,i)=>{let selected=d.key==='store'?state.store===o[1]:state[d.key].has(o[2]);return `<button class="choice ${selected?'sel':''}" data-i="${i}"><span><span class="icon">${o[0]}</span><b>${o[1]}</b><small>${o[2]}</small></span><span class="check">${selected?'✓':''}</span></button>`}).join('')}</div>`}
function calUI(){return `<div style="width:100%"><div class="budget"><span id="calval">${state.cal}</span> <small>kcal</small></div><input class="slider" id="cal" type="range" min="1200" max="3500" step="50" value="${state.cal}"><div class="range"><span>1200</span><span>3500</span></div></div>`}
function budgetUI(){return `<div style="width:100%"><div class="budget"><span id="budval">${state.budget}</span> <small>دج</small></div><input class="slider" id="bud" type="range" min="200" max="3000" step="50" value="${state.budget}"><div class="range"><span>200 دج</span><span>3000 دج</span></div><div class="pills"><button class="pill" data-b="350">اقتصادي</button><button class="pill" data-b="500">متوسط</button><button class="pill" data-b="1000">مريح</button></div></div>`}
function bind(){document.querySelectorAll('.choice').forEach(x=>x.onclick=()=>{const d=stepData[state.step],o=d.opts[+x.dataset.i];if(d.key==='store')state.store=o[1];else if(d.multi){let s=state[d.key];if(s.has(o[2]))s.delete(o[2]);else s.add(o[2]);}render()});const n=document.getElementById('next');n.onclick=()=>{if(state.step===0&&!state.store) return; if(state.step===3&&state.meals.size===0)return;state.step++;render()};const cal=document.getElementById('cal');if(cal)cal.oninput=()=>{state.cal=+cal.value;document.getElementById('calval').textContent=state.cal};const bud=document.getElementById('bud');if(bud)bud.oninput=()=>{state.budget=+bud.value;document.getElementById('budval').textContent=state.budget};document.querySelectorAll('[data-b]').forEach(x=>x.onclick=()=>{state.budget=+x.dataset.b;render()})}
function buildUI(){document.getElementById('root').innerHTML=`<main class="screen center"><div class="mascot"> </div><div class="ring" style="--p:100%"><b>✓</b></div><div class="loading">خلاص، وجدنا لك الخطة 🎉</div><p class="sub">الوصفات مرتبة حسب اختياراتك، الميزانية، الوجبات والأجهزة المتوفرة.</p><div class="summary"><div class="row"><span>الميزانية</span><b>${state.budget} دج/يوم</b></div><div class="row"><span>السعرات</span><b>${state.cal} kcal</b></div><div class="row"><span>الوجبات</span><b>${[...state.meals].map(x=>({breakfast:'فطور',lunch:'غداء',dinner:'عشاء'})[x]).join(' + ')}</b></div></div><button class="btn" onclick="showPlan()">شوف الخطة</button></main>`}
function filtered(){return recipes.filter(x=>state.meals.has(x.type)&&x.cost<=state.budget&&state.dietsMatch!==false&&!([...state.diets].some(d=>d==='gluten-free')&&x.tags.includes('gluten-risk'))&&[...x.need].every(n=>state.tools.size===0||state.tools.has(n)||n==='pan'&&state.tools.has('pot')))}
function showPlan(){let pool=filtered();if(!pool.length)pool=recipes.filter(x=>state.meals.has(x.type)&&x.cost<=state.budget);const groups=[['السبت','breakfast','lunch','dinner'],['الأحد','breakfast','lunch','dinner'],['الإثنين','breakfast','lunch','dinner'],['الثلاثاء','breakfast','lunch','dinner'],['الأربعاء','breakfast','lunch','dinner']];let html=`<main class="screen"><div class="progress"><i style="width:100%"></i></div><div style="text-align:center"><div class="eyebrow">MATBAK DZ • خطة شخصية 🇩🇿</div><h1 class="title">خطة وجباتك جاهزة</h1><p class="sub">ميزانية محسوبة بالدينار، مع مراعاة اختياراتك الغذائية والمطبخ.</p></div>`;groups.forEach((g,di)=>{html+=`<section class="mealday"><div class="day">${g[0]}</div>`;g.slice(1).filter(t=>state.meals.has(t)).forEach((t,mi)=>{let arr=pool.filter(x=>x.type===t);let x=arr[(di+mi)%Math.max(arr.length,1)]||pool[(di+mi)%pool.length];if(x)html+=`<div class="meal"><div class="pic">${x.e}</div><div><h4>${esc(x.t)}</h4><p>${x.time} دقيقة • ${x.c}</p></div><span class="price">≈ ${x.cost} دج</span></div>`});html+='</section>'});html+=`<button class="btn" onclick="location.reload()">نبدل الخطة</button><p class="note">الأسعار تقديرية وليست عرض بيع. قاعدة البيانات الكاملة مصممة لتُجلب من الخادم بصفحات وفهارس، وليست محمّلة داخل APK.</p></main>`;document.getElementById('root').innerHTML=html}
function goSearch(){alert('البحث العالمي سيكون متصلاً بقاعدة الوصفات: عربي + دارجة + فرنسي + English.');}
document.getElementById('back').onclick=()=>{if(state.step>0&&state.step<6){state.step--;render()}else if(state.step===6){state.step=5;render()}else history.back()};render();
</script></body></html>
